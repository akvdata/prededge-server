<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PredEdge Intelligence</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
[data-theme="dark"]{--bg:#000;--bg2:#0c0c0c;--bg3:#060606;--bgc:#111;--bd:#222;--bd2:#333;--bd3:#444;--tx:#e8e8e8;--tx2:#b0b0b0;--tx3:#808080;--tx4:#606060;--or:#FF8C00;--gn:#00E676;--rd:#FF5252;--bl:#448AFF;--cy:#18FFFF;--pk:#FF80AB;--yl:#FFD740;--rl:#FF5252;--rr:#00E676}
[data-theme="light"]{--bg:#f5f5f0;--bg2:#fff;--bg3:#eaeae5;--bgc:#fff;--bd:#d0d0c8;--bd2:#b8b8b0;--bd3:#a0a098;--tx:#1a1a1a;--tx2:#444;--tx3:#777;--tx4:#999;--or:#cc6a00;--gn:#00a854;--rd:#d32f2f;--bl:#1565c0;--cy:#00838f;--pk:#c2185b;--yl:#f57f17;--rl:#d32f2f;--rr:#00a854}
body{background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:3px}
.mn{font-family:'IBM Plex Mono',monospace}
.hdr{background:var(--bg3);border-bottom:2px solid var(--or);padding:8px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap}
.dot{width:8px;height:8px;background:var(--gn);border-radius:50%;box-shadow:0 0 10px var(--gn);animation:p 2s infinite;display:inline-block;flex-shrink:0}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.logo{font:700 13px/1 'IBM Plex Mono',monospace;color:var(--or);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.thm{cursor:pointer;padding:4px 10px;font:500 10px 'IBM Plex Mono',monospace;background:var(--bd);color:var(--tx2);border:1px solid var(--bd2);border-radius:3px;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 12px;background:var(--bg3);border-bottom:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 12px;cursor:pointer;font:500 10px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;text-transform:uppercase;background:var(--bg);color:var(--tx3);border:1px solid var(--bd);flex-shrink:0;min-height:36px}
.tab.on{background:var(--or);color:#000;border-color:var(--or);font-weight:700}
.wrap{padding:12px 16px}.pane{display:none}.pane.on{display:block}
.sh{margin-bottom:10px;border-left:3px solid var(--or);padding-left:10px}
.sh-t{font:700 12px 'IBM Plex Sans',sans-serif;color:var(--or);letter-spacing:.04em;text-transform:uppercase}
.sh-s{font:400 10px 'IBM Plex Sans',sans-serif;color:var(--tx3);margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-bottom:14px}
.st{padding:10px 8px;background:var(--bgc);border:1px solid var(--bd);text-align:center}
.st-l{font:500 8px 'IBM Plex Mono',monospace;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.st-v{font:700 16px 'IBM Plex Mono',monospace}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-bottom:14px}
.card{background:var(--bgc);border:1px solid var(--bd);padding:10px;cursor:pointer;transition:.12s;position:relative;min-width:0}
.card:hover{border-color:var(--or)}.card.bought{border-color:var(--gn);border-width:2px}
.badge{position:absolute;top:6px;right:6px;padding:2px 6px;font:700 8px 'IBM Plex Mono',monospace;text-transform:uppercase}
.badge-buy{background:var(--gn);color:#000}.badge-sell{background:var(--rd);color:#fff}.badge-track{background:var(--bl);color:#fff}
.sl{font:700 10px 'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;padding:3px 8px;display:inline-block}
/* Tables: horizontal scroll, all columns preserved */
.tw{border:1px solid var(--bd);overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:12px;max-width:100%}
table{width:max-content;min-width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{padding:6px 8px;text-align:left;font:600 9px 'IBM Plex Mono',monospace;color:var(--or);letter-spacing:.04em;text-transform:uppercase;border-bottom:2px solid var(--bd2);background:var(--bg3);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:5px 8px;font:400 10px 'IBM Plex Mono',monospace;border-bottom:1px solid var(--bd);white-space:nowrap}
tr:hover{background:var(--bg2)}
.sig{padding:2px 6px;font:700 8px 'IBM Plex Mono',monospace;display:inline-block}
.sig-buy{background:var(--gn);color:#000}.sig-sell{background:var(--rd);color:#fff}.sig-hold{background:var(--bd2);color:var(--tx2)}
.rel{padding:2px 6px;font:700 7px 'IBM Plex Mono',monospace;display:inline-block}
.modal-bg{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:200;align-items:center;justify-content:center}
.modal-bg.on{display:flex}.modal{background:var(--bgc);border:2px solid var(--or);padding:20px;width:95%;max-width:520px;max-height:90vh;overflow-y:auto}
.btn{padding:8px 16px;font:700 10px 'IBM Plex Mono',monospace;text-transform:uppercase;border:none;cursor:pointer;margin-right:4px;min-height:36px}
.btn-g{background:var(--gn);color:#000}.btn-r{background:var(--rd);color:#fff}.btn-x{background:var(--bd2);color:var(--tx2)}
.inp{background:var(--bg);border:1px solid var(--bd2);padding:8px;font:400 12px 'IBM Plex Mono',monospace;color:var(--tx);width:100%;margin-bottom:6px;min-height:36px}
.inp:focus{outline:none;border-color:var(--or)}
.il{font:500 9px 'IBM Plex Mono',monospace;color:var(--tx3);text-transform:uppercase;display:block;margin-bottom:2px}
.note{padding:10px;background:var(--bg3);border-left:3px solid var(--or);font:400 11px 'IBM Plex Sans',sans-serif;color:var(--tx2);line-height:1.5;margin:10px 0}
.note b{color:var(--or)}
.sb{padding:5px 16px;background:var(--bg3);border-top:2px solid var(--or);font:400 8px 'IBM Plex Mono',monospace;color:var(--tx3);display:flex;justify-content:space-between;position:sticky;bottom:0;flex-wrap:wrap;gap:4px}
/* Mobile */
@media(max-width:640px){
  .logo{font-size:11px;letter-spacing:.06em}
  .cards{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:6px}
  .stats{grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:4px}
  .st{padding:8px 4px}.st-v{font-size:14px}.st-l{font-size:7px}
  .card{padding:8px}
  td{padding:4px 6px;font-size:9px}
  th{padding:4px 6px;font-size:8px}
  .modal{width:100%;max-width:100%;border-radius:0;max-height:100vh;border-width:1px}
  .wrap{padding:10px 10px}
  .hdr{padding:6px 10px}
  .tabs{padding:4px 8px}
}
</style>
</head>
<body>
<div class="hdr">
  <div style="display:flex;align-items:center;gap:8px"><div class="dot"></div><span class="logo">PredEdge Intelligence</span></div>
  <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">
    <button class="thm" onclick="toggleTheme()" id="thm-btn">&#9728; Light</button>
    <span id="status" class="mn" style="font-size:9px;color:var(--or)">Loading...</span>
    <span id="clock" class="mn" style="font-size:9px;color:var(--tx2)"></span>
  </div>
</div>
<div class="tabs" id="tab-bar"></div>
<div class="wrap">
  <div class="pane on" id="p-ov"></div>
  <div class="pane" id="p-q"></div>
  <div class="pane" id="p-ai"></div>
  <div class="pane" id="p-etf"></div>
  <div class="pane" id="p-odds"></div>
  <div class="pane" id="p-pf"></div>
  <div class="pane" id="p-res"></div>
  <div class="pane" id="p-stats"></div>
</div>
<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()"><div class="modal" id="mbody"></div></div>
<div class="sb"><span id="sb-l">...</span><span>Yahoo Finance + Polymarket (real data)</span></div>

<script>
var API=location.origin,prices={},polyData=[],portfolio=[],isDark=true;
var TABS=[["ov","&#127968; Overview"],["q","&#9883;&#65039; Quantum"],["ai","&#129302; AI Infra"],["etf","&#128200; ETFs"],["odds","&#127922; Odds"],["pf","&#128188; Portfolio"],["res","&#128269; Research"]];
if(location.search.indexOf("stats")>=0) TABS.push(["stats","&#128202; Analytics"]);

// Render tabs
document.getElementById("tab-bar").innerHTML=TABS.map(function(t,i){return'<button class="tab'+(i===0?' on':'')+'" onclick="go(\''+t[0]+'\',this)">'+t[1]+'</button>'}).join("");

function toggleTheme(){isDark=!isDark;document.documentElement.setAttribute("data-theme",isDark?"dark":"light");document.getElementById("thm-btn").innerHTML=isDark?"&#9728; Light":"&#127769; Dark"}
function go(id,btn){document.querySelectorAll(".pane").forEach(function(p){p.classList.remove("on")});document.querySelectorAll(".tab").forEach(function(t){t.classList.remove("on")});document.getElementById("p-"+id).classList.add("on");btn.classList.add("on")}

// ── Analytics tracking ──
function getVid(){var v=localStorage.getItem("pe_vid");if(!v){v="v_"+Math.random().toString(36).substr(2,12)+Date.now().toString(36);localStorage.setItem("pe_vid",v)}return v}
function trackVisit(){fetch(API+"/api/track",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vid:getVid()})}).catch(function(){})}

// ── Helpers ──
function spark(data,w,h){w=w||70;h=h||20;if(!data||data.length<2)return"";var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data),rng=mx-mn||1;var col=data[data.length-1]>=data[0]?"var(--gn)":"var(--rd)";var pts=data.map(function(v,i){return(i/(data.length-1))*w+","+(h-((v-mn)/rng)*h)}).join(" ");return'<svg width="'+w+'" height="'+h+'" style="display:block;margin-top:3px"><polyline points="'+pts+'" fill="none" stroke="'+col+'" stroke-width="1.2"/></svg>'}

function w52bar(pct,lo,hi){var p=Math.max(0,Math.min(100,pct||50));return'<div style="margin:5px 0 2px"><div style="display:flex;justify-content:space-between;font:400 8px monospace;color:var(--tx3)"><span>$'+(lo||0).toFixed(2)+'</span><span class="mn" style="color:var(--or);font-weight:600;font-size:9px">'+p.toFixed(0)+'%</span><span>$'+(hi||0).toFixed(2)+'</span></div><div style="height:5px;background:var(--bd);border-radius:3px;position:relative;margin-top:2px;overflow:visible"><div style="height:5px;border-radius:3px;background:linear-gradient(90deg,var(--rl),var(--yl),var(--rr));opacity:0.3;width:100%"></div><div style="position:absolute;left:'+p+'%;top:50%;width:10px;height:10px;background:var(--or);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--or)"></div></div></div>'}

function etfTags(exp){if(!exp||!exp.length)return"";return'<div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:2px">'+exp.slice(0,3).map(function(e){return'<span style="font:600 7px monospace;padding:1px 4px;background:var(--bg3);color:var(--bl);border:1px solid var(--bd2)">'+e.etf+" "+e.weight+"%</span>"}).join("")+"</div>"}

function renderCard(s){var col=s.change>=0?"var(--gn)":"var(--rd)";var arr=s.change>=0?"\u25B2":"\u25BC";var bought=portfolio.some(function(p){return p.ticker===s.ticker});var sigCls=s.signal==="BUY"?"badge-buy":s.signal==="SELL"?"badge-sell":"";var ytdC=(s.ytdPct||0)>=0?"var(--gn)":"var(--rd)";return'<div class="card'+(bought?" bought":"")+'" onclick="openModal(\''+s.ticker+'\')">'+
(bought?'<div class="badge badge-track">TRACKING</div>':"")+(s.signal!=="HOLD"?'<div class="badge '+sigCls+'">'+s.signal+"</div>":"")+
'<div class="mn" style="font-weight:700;font-size:14px;color:var(--or)">'+s.ticker+'</div><div style="font-size:9px;color:var(--tx2);margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+s.name+'</div><div class="mn" style="font-weight:700;font-size:18px;color:'+col+'">$'+s.price.toFixed(2)+'</div><div class="mn" style="font-weight:600;font-size:10px;color:'+col+'">'+arr+" "+Math.abs(s.change).toFixed(2)+" ("+(s.changePct>=0?"+":"")+s.changePct.toFixed(2)+'%)</div><div style="display:flex;justify-content:space-between;margin-top:4px;font:500 8px monospace"><span style="color:var(--tx3)">YTD: <span style="color:'+ytdC+'">'+(s.ytdPct>=0?"+":"")+((s.ytdPct||0).toFixed(1))+'%</span></span><span style="color:var(--tx4)">RSI:'+(s.rsi||"\u2014")+"</span></div>"+w52bar(s.w52RangePct,s.w52Low,s.w52High)+etfTags(s.etfExposure)+spark(s.history)+"</div>"}

function sectionHTML(stocks,label){var buys=stocks.filter(function(s){return s.signal==="BUY"});var avg=stocks.length?stocks.reduce(function(a,b){return a+b.changePct},0)/stocks.length:0;return'<div class="sh"><div class="sh-t">'+label+'</div></div><div class="stats"><div class="st"><div class="st-l">Stocks</div><div class="st-v" style="color:var(--tx)">'+stocks.length+'</div></div><div class="st"><div class="st-l">Buy Sigs</div><div class="st-v" style="color:var(--gn)">'+buys.length+'</div></div><div class="st"><div class="st-l">Avg Chg</div><div class="st-v" style="color:'+(avg>=0?"var(--gn)":"var(--rd)")+'">'+(avg>=0?"+":"")+avg.toFixed(2)+'%</div></div></div><div class="cards">'+stocks.map(renderCard).join("")+'</div><div class="tw"><table><thead><tr><th>Ticker</th><th>Name</th><th>Price</th><th>Chg</th><th>%</th><th>YTD</th><th>52W Low</th><th>52W High</th><th>52W Pos</th><th>RSI</th><th>Signal</th><th>Reason</th><th>ETFs</th></tr></thead><tbody>'+stocks.map(function(s){var col=s.change>=0?"var(--gn)":"var(--rd)";var sc=s.signal==="BUY"?"sig-buy":s.signal==="SELL"?"sig-sell":"sig-hold";var yc=(s.ytdPct||0)>=0?"var(--gn)":"var(--rd)";var etfs=(s.etfExposure||[]).slice(0,2).map(function(e){return e.etf+"("+e.weight+"%)"}).join(" ");return'<tr onclick="openModal(\''+s.ticker+'\')" style="cursor:pointer"><td style="font-weight:700;color:var(--or)">'+s.ticker+'</td><td style="color:var(--tx2)">'+s.name+'</td><td style="color:'+col+';font-weight:700">$'+s.price.toFixed(2)+'</td><td style="color:'+col+'">'+(s.change>=0?"+":"")+s.change.toFixed(2)+'</td><td style="color:'+col+';font-weight:700">'+(s.changePct>=0?"+":"")+s.changePct.toFixed(2)+'%</td><td style="color:'+yc+';font-weight:600">'+(s.ytdPct>=0?"+":"")+((s.ytdPct||0).toFixed(1))+'%</td><td style="color:var(--tx3)">$'+(s.w52Low||0).toFixed(2)+'</td><td style="color:var(--tx3)">$'+(s.w52High||0).toFixed(2)+'</td><td style="color:var(--or)">'+(s.w52RangePct||0).toFixed(0)+'%</td><td style="color:'+((s.rsi||50)<30?"var(--gn)":(s.rsi||50)>70?"var(--rd)":"var(--tx2)")+'">'+(s.rsi||"\u2014")+'</td><td><span class="sig '+sc+'">'+s.signal+'</span></td><td style="font-size:9px;color:var(--tx2)">'+(s.reason||"")+'</td><td style="font-size:8px;color:var(--bl)">'+(etfs||"\u2014")+"</td></tr>"}).join("")+"</tbody></table></div>"}

function renderOverview(){var all=Object.values(prices);var q=all.filter(function(s){return s.sector==="quantum"});var ai=all.filter(function(s){return s.sector==="ai"});var etf=all.filter(function(s){return s.sector==="etf"});var buys=all.filter(function(s){return s.signal==="BUY"});var top=all.length?all.reduce(function(a,b){return a.changePct>b.changePct?a:b}):null;var bot=all.length?all.reduce(function(a,b){return a.changePct<b.changePct?a:b}):null;var pv=portfolio.reduce(function(s,p){var st=prices[p.ticker];return s+(st?st.price*p.qty:0)},0);var pc=portfolio.reduce(function(s,p){return s+p.costBasis*p.qty},0);document.getElementById("p-ov").innerHTML='<div class="sh"><div class="sh-t">Market overview</div><div class="sh-s">Real-time \u00b7 52W from Yahoo Finance \u00b7 Signals: 14d RSI + drawdown</div></div><div class="stats"><div class="st"><div class="st-l">Buy Sigs</div><div class="st-v" style="color:var(--gn)">'+buys.length+'</div></div><div class="st"><div class="st-l">Top Gainer</div><div class="st-v" style="color:var(--gn);font-size:13px">'+(top?top.ticker+" +"+top.changePct.toFixed(1)+"%":"\u2014")+'</div></div><div class="st"><div class="st-l">Top Loser</div><div class="st-v" style="color:var(--rd);font-size:13px">'+(bot?bot.ticker+" "+bot.changePct.toFixed(1)+"%":"\u2014")+'</div></div><div class="st"><div class="st-l">P&L</div><div class="st-v" style="color:'+((pv-pc)>=0?"var(--gn)":"var(--rd)")+'">'+(pv-pc>=0?"+":"")+"$"+(pv-pc).toFixed(0)+'</div></div><div class="st"><div class="st-l">Poly Mkts</div><div class="st-v" style="color:var(--or)">'+polyData.length+"</div></div></div>"+(buys.length?'<div class="sl" style="background:var(--bg2);color:var(--gn);border-left:3px solid var(--gn)">\u26A1 BUY SIGNALS</div><div class="cards">'+buys.map(renderCard).join("")+"</div>":"")+'<div class="sl" style="background:var(--bg2);color:var(--cy);border-left:3px solid var(--cy)">\u269B\uFE0F QUANTUM</div><div class="cards">'+q.map(renderCard).join("")+'</div><div class="sl" style="background:var(--bg2);color:var(--pk);border-left:3px solid var(--pk)">\uD83E\uDD16 AI INFRA</div><div class="cards">'+ai.map(renderCard).join("")+'</div><div class="sl" style="background:var(--bg2);color:var(--bl);border-left:3px solid var(--bl)">\uD83D\uDCCA ETFs</div><div class="cards">'+etf.map(renderCard).join("")+"</div>"}

function renderOdds(){var el=document.getElementById("p-odds");if(!polyData.length){el.innerHTML='<div class="sh"><div class="sh-t">Prediction market odds</div></div><div style="padding:40px;text-align:center"><div class="mn" style="font-size:13px;color:var(--or);margin-bottom:8px">Loading Polymarket...</div><button class="btn btn-x" onclick="forceOdds()">\u21BB Retry</button></div>';return}el.innerHTML='<div class="sh"><div class="sh-t">Prediction odds (live)</div><div class="sh-s">Polymarket Gamma API \u00b7 Cross-reference with stock signals</div></div><div class="stats"><div class="st"><div class="st-l">Markets</div><div class="st-v" style="color:var(--or)">'+polyData.length+'</div></div><div class="st"><div class="st-l">24h Vol</div><div class="st-v" style="color:var(--bl)">$'+(polyData.reduce(function(s,m){return s+m.vol24},0)/1e6).toFixed(1)+'M</div></div></div><div class="tw"><table><thead><tr><th>#</th><th>Question</th><th>Tag</th><th>YES</th><th>NO</th><th>Volume</th><th>24h</th><th>Relevance</th></tr></thead><tbody>'+polyData.map(function(m,i){var sty=m.relColor==="green"?"background:var(--bg2);color:var(--gn);border:1px solid var(--gn)":m.relColor==="amber"?"background:var(--bg2);color:var(--yl);border:1px solid var(--yl)":m.relColor==="red"?"background:var(--bg2);color:var(--rd);border:1px solid var(--rd)":"background:var(--bd);color:var(--tx3)";return'<tr><td style="color:var(--tx4)">'+(i+1)+'</td><td style="font-family:sans-serif;font-size:10px;max-width:280px;overflow:hidden;text-overflow:ellipsis;color:var(--tx)">'+m.question+'</td><td style="font-size:8px;color:var(--tx3)">'+m.tag+'</td><td style="color:var(--gn);font-weight:700;font-size:12px">'+(m.yesPrice*100).toFixed(0)+'%</td><td style="color:var(--rd);font-weight:600">'+(m.noPrice*100).toFixed(0)+'%</td><td style="color:var(--tx2)">'+(m.volume>1e6?(m.volume/1e6).toFixed(1)+"M":m.volume>1e3?(m.volume/1e3).toFixed(0)+"K":m.volume.toFixed(0))+'</td><td style="color:var(--tx2)">'+(m.vol24>1e3?(m.vol24/1e3).toFixed(1)+"K":m.vol24.toFixed(0))+'</td><td><span class="rel" style="'+sty+'">'+m.relevance+"</span></td></tr>"}).join("")+'</tbody></table></div><div class="note"><b>Reading odds:</b> Fed rate cut rising \u2192 bullish tech. Recession >40% \u2192 defensive. Tariff markets = trade risk. Use alongside RSI/drawdown.</div>'}

        '<div style="display:flex;justify-content:space-between;align-items:baseline"><span class="mn" style="font-weight:700;font-size:13px;color:var(--or)">'+r.ticker+'</span><span class="mn" style="font-weight:700;font-size:13px;color:'+rc+'">$'+(r.price||0).toFixed(2)+'</span></div>'+

        '<div style="margin:5px 0 2px"><div style="display:flex;justify-content:space-between;font:400 7px var(--mn,monospace);color:var(--tx4)"><span>$'+(r.w52Low||0).toFixed(2)+'</span><span style="color:var(--or);font-weight:600;font-size:8px">'+rp.toFixed(0)+'%</span><span>$'+(r.w52High||0).toFixed(2)+'</span></div>'+
        '<div style="height:4px;background:var(--bd);border-radius:2px;position:relative;margin-top:2px;overflow:visible"><div style="height:4px;border-radius:2px;background:linear-gradient(90deg,var(--rl),var(--yl),var(--rr));opacity:0.25;width:100%"></div><div style="position:absolute;left:'+rp+'%;top:50%;width:9px;height:9px;background:var(--or);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 5px var(--or)"></div></div></div>'+
        '<div style="font-size:8px;color:var(--tx4);margin-top:3px;border-top:1px solid var(--bd);padding-top:3px">'+r.rel+'</div>'+
        '</div></div></div>'}).join("")+'</div>';
  }

  // ETF exposure or holdings
  var etfHTML='';
  if(d.type==="ETF"&&d.holdings&&d.holdings.length){
    etfHTML='<div style="background:var(--bgc);border:1px solid var(--bd);padding:12px;margin-bottom:10px"><div class="mn" style="font-size:10px;font-weight:600;color:var(--bl);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px">Top holdings</div>'+
      d.holdings.map(function(h){return'<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:10px"><span class="mn" style="font-weight:700;color:var(--or);width:50px;cursor:pointer" onclick="doLookupTicker(this.dataset.t)" data-t="'+h.ticker+'">'+h.ticker+'</span><span style="color:var(--tx2);flex:1">'+h.name+'</span><div style="width:80px;height:4px;background:var(--bd);border-radius:2px"><div style="height:4px;background:var(--bl);border-radius:2px;width:'+Math.min(h.weight*10,100)+'%"></div></div><span class="mn" style="font-weight:600;color:var(--tx);width:45px;text-align:right">'+h.weight.toFixed(1)+'%</span></div>'}).join("")+'</div>';
  }else if(d.etfExposure&&d.etfExposure.length){
    etfHTML='<div style="background:var(--bgc);border:1px solid var(--bd);padding:12px;margin-bottom:10px"><div class="mn" style="font-size:10px;font-weight:600;color:var(--bl);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px">ETF exposure</div>'+
      d.etfExposure.map(function(e){return'<div style="display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd);font-size:10px"><span class="mn" style="font-weight:700;color:var(--bl);width:50px">'+e.etf+'</span><div style="flex:1;height:4px;background:var(--bd);border-radius:2px"><div style="height:4px;background:var(--bl);border-radius:2px;width:'+Math.min(e.weight*4,100)+'%"></div></div><span class="mn" style="font-weight:600;color:var(--tx);width:45px;text-align:right">'+e.weight+'%</span></div>'}).join("")+'</div>';
  }

  // Assemble
  el.innerHTML=searchHTML+
    '<div style="display:flex;align-items:baseline;gap:12px;margin-bottom:4px"><span class="mn" style="font-size:22px;font-weight:700;color:var(--or)">'+d.ticker+'</span><span style="font-size:13px;color:var(--tx2)">'+d.name+'</span></div>'+
    '<div style="margin-bottom:4px">'+tags+'</div>'+
    (d.desc?'<div style="font-size:10px;color:var(--tx4);margin-bottom:14px;line-height:1.4">'+d.desc+'</div>':'')+
    '<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:220px">'+
        '<div style="background:var(--bgc);border:1px solid var(--bd);padding:12px;margin-bottom:10px">'+
          '<div class="mn" style="font-size:10px;font-weight:600;color:var(--or);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px">Price and performance</div>'+
          '<div class="mn" style="font-size:28px;font-weight:700;color:'+col+';margin-bottom:2px">$'+p.current.toFixed(2)+'</div>'+
          '<div class="mn" style="font-size:12px;font-weight:600;color:'+col+';margin-bottom:10px">'+arr+' '+Math.abs(p.change).toFixed(2)+' ('+(p.changePct>=0?"+":"")+p.changePct.toFixed(2)+'%)</div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Prev close</span><span class="mn" style="font-weight:600">$'+p.prevClose.toFixed(2)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Day range</span><span class="mn" style="font-weight:600">$'+(p.dayLow||0).toFixed(2)+' - $'+(p.dayHigh||0).toFixed(2)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">52W range</span><span class="mn" style="font-weight:600">$'+p.w52Low.toFixed(2)+' - $'+p.w52High.toFixed(2)+'</span></div>'+
          '<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font:400 8px var(--mn,monospace);color:var(--tx3)"><span>$'+p.w52Low.toFixed(2)+'</span><span style="color:var(--or);font-weight:600;font-size:9px">'+p.w52Pct.toFixed(0)+'%</span><span>$'+p.w52High.toFixed(2)+'</span></div><div style="height:6px;background:var(--bd);border-radius:3px;position:relative;margin-top:2px;overflow:visible"><div style="height:6px;border-radius:3px;background:linear-gradient(90deg,var(--rl),var(--yl),var(--rr));opacity:0.25;width:100%"></div><div style="position:absolute;left:'+p.w52Pct+'%;top:50%;width:12px;height:12px;background:var(--or);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 6px var(--or)"></div></div></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">YTD return</span><span class="mn" style="font-weight:600;color:'+ytdCol+'">'+(p.ytdPct>=0?"+":"")+p.ytdPct.toFixed(1)+'%</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Volume</span><span class="mn" style="font-weight:600">'+(p.volume?p.volume.toLocaleString():"\u2014")+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div style="flex:1;min-width:220px">'+
        '<div style="background:var(--bgc);border:1px solid var(--bd);padding:12px;margin-bottom:10px">'+
          '<div class="mn" style="font-size:10px;font-weight:600;color:var(--or);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px">Key indicators</div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Market cap</span><span class="mn" style="font-weight:600">'+fmtCap(ind.marketCap)+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">P/E (trailing)</span><span class="mn" style="font-weight:600">'+(ind.peTrailing||"\u2014")+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">P/E (forward)</span><span class="mn" style="font-weight:600">'+(ind.peForward||"\u2014")+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Beta</span><span class="mn" style="font-weight:600">'+(ind.beta||"\u2014")+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">Div yield</span><span class="mn" style="font-weight:600">'+(ind.divYield?ind.divYield+"%":"\u2014")+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--bd);font-size:11px"><span style="color:var(--tx3)">RSI (14d)</span><span class="mn" style="font-weight:600;color:'+((ind.rsi||50)<30?"var(--gn)":(ind.rsi||50)>70?"var(--rd)":"var(--tx)")+'">'+(ind.rsi||"\u2014")+'</span></div>'+
          targetHTML+
          analystBar+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">'+
      '<div style="flex:1;min-width:220px"><div style="background:var(--bgc);border:1px solid var(--bd);padding:12px"><div class="mn" style="font-size:10px;font-weight:600;color:var(--or);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--bd);padding-bottom:6px">News</div>'+newsHTML+'</div></div>'+
      '<div style="flex:1;min-width:220px">'+etfHTML+'</div>'+
    '</div>'+
    (d.related&&d.related.length?'<div style="background:var(--bgc);border:1px solid var(--bd);padding:12px;margin-bottom:12px"><div class="mn" style="font-size:10px;font-weight:600;color:var(--or);text-transform:uppercase;margin-bottom:10px;border-bottom:1px solid var(--bd);padding-bottom:6px">'+(d.type==="ETF"?"Related ETFs":"Related stocks — supply chain and competitors")+'</div>'+relHTML+'</div>':'');
}

async function doLookup(){
  var inp=document.getElementById("res-input");
  if(!inp)return;
  var ticker=inp.value.trim().toUpperCase();
  if(!ticker)return;
  researchLoading=true;
  researchData=null;
  renderResearch();
  try{
    var r=await fetch(API+"/api/lookup/"+encodeURIComponent(ticker));
    researchData=await r.json();
  }catch(e){
    researchData={error:"Failed to fetch data. Try again."};
  }
  researchLoading=false;
  renderResearch();
}

function doLookupTicker(t){
  var inp=document.getElementById("res-input");
  if(inp)inp.value=t;
  doLookup();
}

async function init(){var tick=function(){document.getElementById("clock").textContent=new Date().toLocaleTimeString("en-GB")};tick();setInterval(tick,1000);trackVisit();await Promise.all([loadPrices(),loadPoly(),loadPf()]);if(Object.keys(prices).length)updSt();else{document.getElementById("status").textContent="API offline";document.getElementById("status").style.color="var(--rd)"}renderAll();setInterval(async function(){await loadPrices();renderAll()},30000);setInterval(async function(){await loadPoly();renderOdds()},60000)}
init();
</script>
